name: Keep Render service awake

# Pings the health endpoint every 10 minutes so Render's free tier doesn't
# spin the app down from inactivity (it sleeps after ~15 minutes idle).
# This is free — it runs on GitHub's own infrastructure, not Render's.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -o /dev/null -w "Status: %{http_code}\n" https://katdesign-backend.onrender.com/api/health
